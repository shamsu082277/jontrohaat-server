services:
  - type: web
    name: jontrohaat-api
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_NAME
        value: jontrohaat
      - key: AUTH_USER_COLLECTION
        value: user
      - key: STRIPE_CURRENCY
        value: bdt
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: BETTER_AUTH_JWKS_URL
        sync: false
      - key: JWT_ISSUER
        sync: false
      - key: JWT_AUDIENCE
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
